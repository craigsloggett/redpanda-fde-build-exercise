services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - 19092:19092
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test:
        - CMD-SHELL
        - rpk cluster health | grep -E 'Healthy:.+true'
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: creates the topics and turns off the broker's usage reporting to Redpanda Data.
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -e
        rpk cluster config set enable_metrics_reporter false -X admin.hosts=redpanda:9644
        for topic in ${TOPIC_ENRICHED:-wiki.edits.enriched} ${TOPIC_VERDICTS:-wiki.edits.verdicts}; do
          rpk topic describe "$$topic" -X brokers=redpanda:9092 >/dev/null 2>&1 \
            || rpk topic create "$$topic" -X brokers=redpanda:9092
        done
    depends_on:
      redpanda:
        condition: service_healthy

  console:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    environment:
      KAFKA_BROKERS: redpanda:9092
      ANALYTICS_ENABLED: 'false'
    ports:
      - 8081:8080
    depends_on:
      redpanda:
        condition: service_healthy

  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiki}
      POSTGRES_DB: wiki
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wiki -d wiki]
      interval: 5s
      timeout: 5s
      retries: 20

  connect-ingest:
    image: docker.redpanda.com/redpandadata/connect:4.108.0
    command: [--disable-telemetry, run, /connect/ingest.yaml]
    environment:
      REDPANDA_BROKERS: redpanda:9092
      TOPIC_ENRICHED: ${TOPIC_ENRICHED:-wiki.edits.enriched}
      USER_AGENT: ${USER_AGENT:-redpanda-fde-build-exercise (github.com/craigsloggett/redpanda-fde-build-exercise)}
      SAMPLE_PERMILLE: ${SAMPLE_PERMILLE:-50}
    volumes:
      - ./connect:/connect:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  redpanda:
  postgres:
